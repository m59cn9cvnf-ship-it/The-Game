<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME: Scorecard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        .card { background: #1e293b; border-radius: 12px; padding: 12px; border-bottom: 3px solid #334155; }
        
        /* Table Styles */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; min-width: 50px; }
        
        /* Sticky First Column */
        .sticky-col { position: sticky; left: 0; background: #1e293b; z-index: 10; min-width: 100px; text-align: left; font-weight: bold; border-right: 2px solid #475569; }
        
        /* Score Cell */
        .score-cell { position: relative; height: 45px; background: #0f172a; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .stroke-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; }
        .par-row { background: #1e293b; color: #94a3b8; font-size: 0.75rem; }
        .hole-header { background: #334155; color: #cbd5e1; font-weight: 800; }
    </style>
</head>
<body class="p-2">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <h1 class="text-xl font-black italic text-emerald-400">THE GAME</h1>
            <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-[10px] bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 uppercase font-bold">Setup</button>
        </header>

        <section id="setup" class="card mb-4">
            <div class="space-y-2 mb-4">
                <div class="flex gap-2"><input type="text" id="p0-n" placeholder="Name" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p0-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p1-n" placeholder="Name" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p1-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p2-n" placeholder="Name" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p2-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p3-n" placeholder="Name" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p3-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
            </div>
            <button onclick="saveRoster()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-xs">Lock In Roster</button>
        </section>

        <div class="table-container mb-4">
            <table id="scorecard-table">
                <thead>
                    <tr id="header-row" class="hole-header">
                        <th class="sticky-col">HOLE</th>
                        </tr>
                    <tr id="par-row" class="par-row">
                        <th class="sticky-col text-[10px]">PAR</th>
                        </tr>
                </thead>
                <tbody id="player-rows">
                    </tbody>
            </table>
        </div>

        <div class="card bg-slate-900 border-emerald-500/30 flex justify-between items-center">
            <div id="stats-summary" class="text-xs space-y-1">
                <div id="nassau-val" class="text-emerald-400 font-bold text-lg">Nassau: All Square</div>
                <div id="trash-vals" class="text-slate-400 font-mono">T1: $0 | T2: $0</div>
            </div>
            <button id="press-btn" onclick="callPress()" class="hidden bg-red-600 px-4 py-3 rounded-lg font-black text-xs animate-pulse">PRESS</button>
        </div>
    </div>

    <script>
        const course = {
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
        };
        let roster = [];
        let totals = { t1: 0, t2: 0, nassau: 0 };
        let scores = {}; // { playerIdx_holeNum: score }

        function init() {
            const hRow = document.getElementById('header-row');
            const pRow = document.getElementById('par-row');
            for(let i=1; i<=18; i++) {
                hRow.innerHTML += `<th>${i}</th>`;
                pRow.innerHTML += `<td>${course.pars[i-1]}</td>`;
            }
        }

        function saveRoster() {
            roster = [];
            const tbody = document.getElementById('player-rows');
            tbody.innerHTML = '';
            
            for(let i=0; i<4; i++) {
                let name = document.getElementById(`p${i}-n`).value || `P${i+1}`;
                let idx = parseFloat(document.getElementById(`p${i}-i`).value) || 0;
                let ch = Math.round((idx * (121 / 113)) + (70.1 - 71));
                roster.push({ name, ch });

                let rowHtml = `<tr id="p-row-${i}"><td class="sticky-col text-xs uppercase">${name}<br><span class="text-[9px] text-slate-500 font-normal">CH: ${ch}</span></td>`;
                for(let h=1; h<=18; h++) {
                    const hasStroke = ch >= course.hcp[h-1];
                    rowHtml += `<td class="score-cell" onclick="enterScore(${i}, ${h})">
                                    <span id="score-${i}-${h}"></span>
                                    ${hasStroke ? '<div class="stroke-dot"></div>' : ''}
                                </td>`;
                }
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            }
            document.getElementById('setup').classList.add('hidden');
        }

        function enterScore(pIdx, holeNum) {
            const isP3 = course.pars[holeNum-1] === 3;
            if(isP3 && pIdx === 0 && confirm("Moose Knuckle Challenged?")) {
                let res = prompt("1:Birdie(+5 T1), 2:Par(+2 T1), 3:Bogey(+1 T2)");
                if(res === '1') totals.t1 += 5;
                if(res === '2') totals.t1 += 2;
                if(res === '3') totals.t2 += 1;
            }

            let val = prompt(`Gross Score for ${roster[pIdx].name}:`);
            if(val) {
                scores[`${pIdx}_${holeNum}`] = parseInt(val);
                document.getElementById(`score-${pIdx}-${holeNum}`).innerText = val;
                calculateHole(holeNum);
            }
        }

        function calculateHole(h) {
            let nets = [];
            for(let i=0; i<4; i++) {
                let gross = scores[`${i}_${h}`];
                if(!gross) return; // Wait for all 4
                let strokes = roster[i].ch >= course.hcp[h-1] ? 1 : 0;
                nets[i] = gross - strokes;
                
                // Trash
                if(gross === course.pars[h-1] - 1) i < 2 ? totals.t1 += 1 : totals.t2 += 1;
            }

            let t1Net = Math.min(nets[0], nets[1]);
            let t2Net = Math.min(nets[2], nets[3]);
            if(t1Net < t2Net) totals.nassau += 1;
            if(t2Net < t1Net) totals.nassau -= 1;
            updateUI();
        }

        function updateUI() {
            document.getElementById('t1-money').innerText = `$${totals.t1}`; // Wait, fixed logic below
            document.getElementById('trash-vals').innerText = `T1: $${totals.t1} | T2: $${totals.t2}`;
            let n = totals.nassau;
            document.getElementById('nassau-val').innerText = n > 0 ? `Nassau: T1 +${n}` : (n < 0 ? `Nassau: T2 +${Math.abs(n)}` : "Nassau: AS");
            document.getElementById('press-btn').classList.toggle('hidden', n === 0);
        }

        function callPress() { alert("Press Added!"); }
        window.onload = init;
    </script>
</body>
</html>
