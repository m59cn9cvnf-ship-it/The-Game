<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME: v9.2 Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; font-family: sans-serif; overflow-x: hidden; font-size: 17px; }
        .card { background: #1e293b; border-radius: 16px; padding: 16px; border-bottom: 4px solid #334155; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #334155; padding: 14px 12px; text-align: center; min-width: 65px; position: relative; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; z-index: 20; min-width: 135px; text-align: left; border-right: 3px solid #475569; font-size: 15px; font-weight: 800; }
        .score-cell { height: 65px; background: #0f172a; font-weight: 900; font-size: 1.6rem; color: #f8fafc; }
        .stat-col { background: #1e293b; font-weight: 900; color: #10b981; min-width: 60px; font-size: 15px; }
        .winner-highlight { background-color: rgba(16, 185, 129, 0.3) !important; color: #34d399 !important; }
        .stroke-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: #fbbf24; border-radius: 50%; }
        .jp-badge { font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; background: #ef4444; color: white; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 10; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
        .trash-btn { background: #334155; border: 1px solid #475569; border-radius: 6px; padding: 12px 4px; font-size: 10px; font-weight: 900; color: #cbd5e1; line-height: 1.2; }
        .trash-btn.active { background: #10b981; border-color: #34d399; color: white; }
        .trash-btn.active-red { background: #ef4444; border-color: #f87171; color: white; }
        input, select { background: #0f172a !important; color: white !important; border: 1px solid #334155 !important; }
        #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 14px 28px; border-radius: 50px; font-weight: 900; font-size: 14px; z-index: 200; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); pointer-events: none; }
        .log-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 13px; }
    </style>
</head>
<body class="p-2">

    <div id="toast">SYNCED</div>

    <div id="app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <h1 class="text-2xl font-black italic text-emerald-400 uppercase tracking-tighter">The Game</h1>
            <div class="flex gap-2">
                <button onclick="safeNewRound()" class="text-[11px] bg-slate-800 px-4 py-2 rounded-full border border-slate-700 uppercase font-bold text-white">New Round</button>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-[11px] bg-slate-800 px-4 py-2 rounded-full border border-slate-700 uppercase font-bold text-emerald-400">Setup</button>
            </div>
        </header>

        <section id="setup" class="card mb-4 hidden">
            <div class="mb-6"><h2 class="text-[11px] font-black text-blue-400 uppercase mb-2 tracking-widest italic">1. Cloud Sync</h2><input type="text" id="game-id-in" placeholder="GAME CODE" class="p-3 rounded-xl w-full text-sm font-mono uppercase"></div>
            <div class="mb-6">
                <h2 class="text-[11px] font-black text-amber-400 uppercase mb-2 tracking-widest italic">2. Rosters</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-3"><input type="text" id="t1-name-in" placeholder="Team A" class="p-2 rounded w-full text-xs font-bold"><div id="t1-players" class="space-y-3"></div></div>
                    <div class="space-y-3"><input type="text" id="t2-name-in" placeholder="Team B" class="p-2 rounded w-full text-xs font-bold"><div id="t2-players" class="space-y-3"></div></div>
                </div>
            </div>
            <div class="mb-6">
                <h2 class="text-[11px] font-black text-emerald-400 uppercase mb-2 tracking-widest italic">3. Course</h2>
                <select id="course-selector" onchange="loadSavedCourse(this.value)" class="w-full p-3 rounded-xl text-sm mb-3"><option value="">-- Manual Entry --</option></select>
                <div class="grid grid-cols-3 gap-2 mb-2"><input type="text" id="course-name" placeholder="Name" class="p-2 rounded text-xs col-span-3"><input type="number" id="course-rating" placeholder="Rate" class="p-2 rounded text-xs"><input type="number" id="course-slope" placeholder="Slope" class="p-2 rounded text-xs"><input type="number" id="course-par" placeholder="Par" class="p-2 rounded text-xs"></div>
                <input type="text" id="course-pars-list" placeholder="Pars (4,4,3...)" class="p-2 rounded w-full text-xs mb-1"><input type="text" id="course-hcp-list" placeholder="HCPs (1,13...)" class="p-2 rounded w-full text-xs">
            </div>
            <div class="mb-6 border-t border-slate-700 pt-4"><label class="text-[11px] font-bold text-slate-500 uppercase">Nassau Payout ($)</label><input type="number" id="nassau-val-in" class="p-3 rounded-xl w-full text-sm mt-1" placeholder="5"></div>
            <button onclick="saveEverything()" class="w-full bg-emerald-600 py-5 rounded-2xl font-black uppercase text-sm shadow-xl">Start Round</button>
        </section>

        <div class="table-container mb-4 shadow-2xl"><table id="main-scorecard"><thead><tr id="header-row" class="bg-slate-800 text-slate-400 text-[13px]"><th class="sticky-col">HOLE</th></tr><tr id="par-row" class="bg-slate-900 text-slate-500 text-[11px]"><th class="sticky-col">PAR/HCP</th></tr></thead><tbody id="player-rows"></tbody></table></div>

        <div class="card bg-slate-950 border-emerald-500/40 sticky bottom-2 shadow-2xl">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                <div class="text-[12px] font-black text-emerald-400 uppercase tracking-widest italic">Nassau Ledger</div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('log-modal').style.display='flex'" class="bg-slate-800 px-3 py-2 rounded-lg text-[11px] font-bold uppercase border border-slate-700">Trash Log</button>
                    <button id="press-btn" onclick="openPressMenu()" class="bg-red-600 px-4 py-2 rounded-lg text-[11px] font-black uppercase shadow-lg">Press</button>
                </div>
            </div>
            <div id="match-list" class="space-y-1 mb-3 text-xs"></div>
            <div class="grid grid-cols-2 gap-4 text-[22px] font-black border-t border-slate-800 pt-2 uppercase italic">
                <div id="t1-final" class="text-emerald-400">T1: $0</div>
                <div id="t2-final" class="text-amber-400 text-right">T2: $0</div>
            </div>
        </div>
    </div>

    <div id="score-modal" class="modal">
        <div class="bg-slate-800 p-5 rounded-3xl w-full max-w-sm border border-slate-700 shadow-2xl overflow-y-auto max-h-[95vh]">
            <div id="modal-title" class="font-black text-emerald-400 text-2xl uppercase mb-5 text-center">Hole Entry</div>
            <div id="mk-container" class="hidden mb-4"><button id="mk-btn" onclick="triggerMK()" class="w-full py-3 rounded-xl border border-slate-600 bg-slate-700 text-[11px] font-black uppercase text-slate-300">Moose Knuckle</button></div>
            <div class="space-y-4" id="modal-inputs-area"></div>
            <button onclick="closeModal()" class="w-full mt-8 bg-emerald-600 py-6 rounded-2xl font-black uppercase tracking-widest shadow-xl text-xl">Save Hole</button>
        </div>
    </div>

    <div id="log-modal" class="modal">
        <div class="bg-slate-900 p-6 rounded-2xl w-full max-w-sm border border-slate-700 max-h-[80vh] flex flex-col">
            <h2 class="text-center font-black text-emerald-500 uppercase mb-4 tracking-tighter italic">Trash Log Breakdown</h2>
            <div id="log-content" class="overflow-y-auto flex-grow mb-4 pr-2 text-xs"></div>
            <button onclick="document.getElementById('log-modal').style.display='none'" class="w-full bg-slate-700 py-4 rounded-2xl font-bold uppercase text-xs">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://golf-game-sync-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let course = JSON.parse(localStorage.getItem('golf_course')) || { name: "Logan River", rating: 70.1, slope: 121, par: 71, pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4], hcp: [1,13,11,7,3,15,17,5,9,2,12,16,10,4,18,14,6,8] };
        let roster = JSON.parse(localStorage.getItem('golf_roster')) || { t1: "T1", t2: "T2", players: [], nassauVal: 5, gameID: "" };
        let courseDir = JSON.parse(localStorage.getItem('golf_course_dir')) || [];
        let holeData = JSON.parse(localStorage.getItem('golf_holedata')) || {}; 
        let mk_results = JSON.parse(localStorage.getItem('golf_mk')) || {}; 
        let activeBets = JSON.parse(localStorage.getItem('golf_bets')) || [
            { id: 'f9', name: 'Front 9 (F9)', start: 1, end: 9, type: 'f9' },
            { id: 'b9', name: 'Back 9 (B9)', start: 10, end: 18, type: 'b9' },
            { id: '18', name: 'Total 18 (T18)', start: 1, end: 18, type: '18' }
        ];
        let activeHole = 1;
        let currentModalState = {};

        function init() {
            const cSel = document.getElementById('course-selector');
            courseDir.forEach(c => { cSel.innerHTML += `<option value="${c.name}">${c.name}</option>`; });
            document.getElementById('t1-name-in').value = roster.t1; document.getElementById('t2-name-in').value = roster.t2;
            document.getElementById('game-id-in').value = roster.gameID; document.getElementById('nassau-val-in').value = roster.nassauVal;
            document.getElementById('course-name').value = course.name; document.getElementById('course-rating').value = course.rating;
            document.getElementById('course-slope').value = course.slope; document.getElementById('course-par').value = course.par;
            document.getElementById('course-pars-list').value = course.pars.join(','); document.getElementById('course-hcp-list').value = course.hcp.join(',');
            const t1Div = document.getElementById('t1-players'); const t2Div = document.getElementById('t2-players');
            t1Div.innerHTML = ''; t2Div.innerHTML = '';
            for(let i=0; i<4; i++) {
                const target = i < 2 ? t1Div : t2Div;
                target.innerHTML += `<div class="space-y-1"><input type="text" id="p-n-${i}" value="${roster.players?.[i]?.name || ''}" placeholder="Player ${i+1}" class="p-2 rounded w-full text-sm bg-slate-900 border border-slate-700"><input type="number" step="0.1" id="p-i-${i}" value="${roster.players?.[i]?.idx ?? ''}" placeholder="Index" class="p-2 rounded w-full text-sm bg-slate-900 border border-slate-700"></div>`;
            }
            if(roster.players?.length > 0) { buildTable(); document.getElementById('setup').classList.add('hidden'); }
            else document.getElementById('setup').classList.remove('hidden');
            if(roster.gameID) { db.ref('games/' + roster.gameID).on('value', (snap) => { const d = snap.val(); if(d) { holeData = d.holeData || {}; activeBets = d.activeBets || activeBets; mk_results = d.mk_results || {}; buildTable(); } }); }
        }

        function safeNewRound() {
            const choice = prompt("Confirm New Round?\n1: Clear scores only (keep Courses/Players)\n2: Cancel");
            if(choice === '1') {
                holeData = {}; mk_results = {}; 
                activeBets = [{ id: 'f9', name: 'Front 9 (F9)', start: 1, end: 9, type: 'f9' },{ id: 'b9', name: 'Back 9 (B9)', start: 10, end: 18, type: 'b9' },{ id: '18', name: 'Total 18 (T18)', start: 1, end: 18, type: '18' }];
                localStorage.setItem('golf_holedata', JSON.stringify(holeData));
                localStorage.setItem('golf_mk', JSON.stringify(mk_results));
                localStorage.setItem('golf_bets', JSON.stringify(activeBets));
                location.reload();
            }
        }

        function loadSavedCourse(n) { const c=courseDir.find(x=>x.name===n); if(c){document.getElementById('course-name').value=c.name;document.getElementById('course-rating').value=c.rating;document.getElementById('course-slope').value=c.slope;document.getElementById('course-par').value=c.par;document.getElementById('course-pars-list').value=c.pars.join(',');document.getElementById('course-hcp-list').value=c.hcp.join(',');} }
        function saveEverything() {
            const gid = document.getElementById('game-id-in').value.toUpperCase().trim();
            const nC = { name: document.getElementById('course-name').value, rating: parseFloat(document.getElementById('course-rating').value), slope: parseInt(document.getElementById('course-slope').value), par: parseInt(document.getElementById('course-par').value), pars: document.getElementById('course-pars-list').value.split(',').map(Number), hcp: document.getElementById('course-hcp-list').value.split(',').map(Number) };
            if(!courseDir.find(x=>x.name===nC.name)){courseDir.push(nC);localStorage.setItem('golf_course_dir',JSON.stringify(courseDir));}
            localStorage.setItem('golf_course',JSON.stringify(nC));
            roster = { t1: document.getElementById('t1-name-in').value, t2: document.getElementById('t2-name-in').value, nassauVal: parseFloat(document.getElementById('nassau-val-in').value), gameID: gid, players: [] };
            for(let i=0;i<4;i++){ let n=document.getElementById(`p-n-${i}`).value; let idx=parseFloat(document.getElementById(`p-i-${i}`).value)||0; let ch=Math.round((idx*(nC.slope/113))+(nC.rating-nC.par)); roster.players.push({name:n,idx,ch}); }
            localStorage.setItem('golf_roster',JSON.stringify(roster)); if(gid) pushToCloud(); document.getElementById('setup').classList.add('hidden'); location.reload();
        }

        function pushToCloud() { if(roster.gameID) db.ref('games/'+roster.gameID).set({holeData,activeBets,mk_results,roster,course}); }
        function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',1500);}

        function buildTable() {
            const hR=document.getElementById('header-row'); const pR=document.getElementById('par-row'); hR.innerHTML='<th class="sticky-col">HOLE</th>'; pR.innerHTML='<th class="sticky-col">PAR/HCP</th>';
            for(let i=1; i<=18; i++){ hR.innerHTML+=`<th id="h-head-${i}">${i}<div id="badge-${i}"></div></th>`; pR.innerHTML+=`<td id="p-head-${i}">${course.pars[i-1]}<br><span class="opacity-30">${course.hcp[i-1]}</span></td>`; }
            hR.innerHTML+=`<th class="stat-col">TOT</th><th class="stat-col">+/-</th>`; pR.innerHTML+=`<td class="stat-col"></td><td class="stat-col"></td>`;
            const tbody=document.getElementById('player-rows'); tbody.innerHTML='';
            let wins={}; for(let h=1;h<=18;h++){ let ns=[]; let f=true; for(let i=0;i<4;i++){ let d=holeData[h]?.[i]; if(!d||d.gross===''){f=false;break;} ns[i]=parseInt(d.gross)-(roster.players[i].ch>=course.hcp[h-1]?1:0); } if(f){ let m=Math.min(...ns); wins[h]=ns.map((v,ix)=>v===m?ix:-1).filter(v=>v>-1); } }
            roster.players.forEach((p,pI)=>{
                let tG=0,tP=0; let row=`<tr><td class="sticky-col"><div class="text-[10px] font-black text-emerald-500 uppercase">${pI<2?roster.t1:roster.t2}</div><div class="font-black text-[17px]">${p.name}</div></td>`;
                for(let h=1; h<=18; h++){ const d=holeData[h]?.[pI]||{}; const s=d.gross||''; if(s!==''){tG+=parseInt(s);tP+=course.pars[h-1];} let isp=activeBets.some(b=>b.start===h&&!['f9','b9','18'].includes(b.id)); let pC=isp?'border-l-[5px] border-emerald-500':''; let wC=(wins[h]&&wins[h].includes(pI))?'winner-highlight':''; row+=`<td class="score-cell ${pC} ${wC} ${s!==''?'bg-emerald-950/20':''}" onclick="openModal(${h})"><span>${s}</span>${p.ch>=course.hcp[h-1]?'<div class="stroke-dot"></div>':''}</td>`; }
                const rel=tG>0?(tG-tP):0; row+=`<td class="stat-col">${tG}</td><td class="stat-col ${rel<0?'text-red-400':''}">${rel===0?"E":(rel>0?`+${rel}`:rel)}</td></tr>`; tbody.innerHTML+=row;
            });
            calculateEverything();
        }

        function openModal(h) {
            activeHole=h; document.getElementById('modal-title').innerText=`HOLE ${h}`; document.getElementById('mk-container').classList.toggle('hidden',course.pars[h-1]!==3);
            const area = document.getElementById('modal-inputs-area'); area.innerHTML='';
            roster.players.forEach((p,i)=>{
                const ex=holeData[h]?.[i]||{gross:'',sandie:false,greenie:false,reversie:false,jSingle:false,jDouble:false,j3P:false,jReversie:false};
                currentModalState[i]={...ex};
                area.innerHTML+=`<div class="bg-slate-900/50 p-4 rounded-3xl border border-slate-700/50"><div class="flex justify-between items-center mb-3"><label class="font-black uppercase text-slate-400 text-base">${p.name}</label><input type="number" id="mod-gross-${i}" inputmode="numeric" value="${ex.gross}" class="bg-slate-800 border-2 border-emerald-500/50 p-3 rounded-xl w-24 text-center font-black text-3xl text-emerald-400" oninput="currentModalState[${i}].gross=this.value; if(this.value.length>=1&&${i<3})document.getElementById('mod-gross-${i+1}').focus()"></div><div class="grid grid-cols-4 gap-2"><button onclick="tapT(this,${i},'sandie')" class="trash-btn ${ex.sandie?'active':''}">SANDIE</button><button onclick="tapT(this,${i},'jSingle')" class="trash-btn ${ex.jSingle?'active':''}">J-BIRD</button><button onclick="tapT(this,${i},'jDouble')" class="trash-btn ${ex.jDouble?'active':''}">J-EAGLE</button><button onclick="tapT(this,${i},'j3P',true)" class="trash-btn ${ex.j3P?'active-red':''}">J-3P</button><button onclick="tapT(this,${i},'jReversie',true)" class="trash-btn col-span-4 ${ex.jReversie?'active-red':''}">JONES E REVERSIE ($5)</button>${course.pars[h-1]===3?`<button onclick="tapT(this,${i},'greenie')" class="trash-btn col-span-2 ${ex.greenie?'active':''}">GREENIE</button><button onclick="tapT(this,${i},'reversie',true)" class="trash-btn col-span-2 ${ex.reversie?'active-red':''}">REVERSIE</button>`:''}</div></div>`;
            });
            document.getElementById('score-modal').style.display='flex';
        }

        function tapT(b,i,ty,ir=false){ currentModalState[i][ty]=!currentModalState[i][ty]; b.classList.toggle('active',currentModalState[i][ty]&&!ir); b.classList.toggle('active-red',currentModalState[i][ty]&&ir); showToast("UPDATED"); }
        function closeModal(){ if(!holeData[activeHole])holeData[activeHole]={}; for(let i=0;i<4;i++){holeData[activeHole][i]={...currentModalState[i]};} localStorage.setItem('golf_holedata',JSON.stringify(holeData)); pushToCloud(); document.getElementById('score-modal').style.display='none'; buildTable(); }
        function triggerMK(){ let r=prompt("MK Outcome?\n1: Birdie (+5)\n2: Par (+2)\n3: Bogey (+1 Opp)"); if(['1','2','3'].includes(r))mk_results[activeHole]=r; closeModal(); }

        function calculateEverything() {
            let t1_t=0, t2_t=0, logH='', jpP=0, tStr=[0,0];
            function log(h,l,a,tI){ logH=`<div class="log-row"><span>H${h} - ${l}</span><span class="${tI<2?'text-emerald-400':'text-amber-400'}">+$${a}</span></div>`+logH; tI<2?t1_t+=a:t2_t+=a; }
            for(let i=1;i<=18;i++){if(document.getElementById(`badge-${i}`))document.getElementById(`badge-${i}`).innerHTML='';}
            for(let h=1;h<=18;h++) {
                let r=true, gS=[], nS=[], par=course.pars[h-1];
                for(let i=0;i<4;i++){ let d=holeData[h]?.[i]||{}; if(d.gross===''){r=false;break;} gS[i]=parseInt(d.gross); nS[i]=gS[i]-(roster.players[i].ch>=course.hcp[h-1]?1:0); }
                if(mk_results[h]){ if(mk_results[h]==='1')log(h,"Moose Birdie",5,0); if(mk_results[h]==='2')log(h,"Moose Par",2,0); if(mk_results[h]==='3')log(h,"Moose Challenger",1,2); }
                if(r) {
                    let t1H=false, t2H=false, t1BC=0, t2BC=0;
                    for(let i=0;i<4;i++){
                        let d = holeData[h][i];
                        if(gS[i]===par-1&&!mk_results[h]){ log(h,`${roster.players[i].name} Birdie`,1,i); if(i<2){t1H=true;t1BC++;}else{t2H=true;t2BC++;} }
                        if(gS[i]<=par-2){ log(h,`${roster.players[i].name} Eagle`,10,i); if(i<2){t1H=true;t1BC++;}else{t2H=true;t2BC++;} }
                        if(d.sandie){ log(h,`${roster.players[i].name} Sandie`,1,i); if(i<2)t1H=true; else t2H=true; }
                        if(d.jSingle)log(h,`${roster.players[i].name} Jones Birdie`,3,i);
                        if(d.jDouble)log(h,`${roster.players[i].name} Jones Eagle`,5,i);
                        if(d.j3P)log(h,`${roster.players[i].name} Jones 3P`,1,i<2?2:0);
                        if(d.jReversie)log(h,`${roster.players[i].name} Jones E Reversie`,5,i<2?2:0);
                        if(d.greenie){ log(h,`${roster.players[i].name} Greenie`,1,i); if(i<2)t1H=true; else t2H=true; }
                        if(d.reversie){ log(h,`${roster.players[i].name} Reversie`,1,i<2?2:0); if(i<2)t2H=true; else t1H=true; }
                    }
                    if(t1BC===2&&!mk_results[h])log(h,"DOUBLE DOUG",8,0); if(t2BC===2&&!mk_results[h])log(h,"DOUBLE DOUG",8,2);
                    if(t1H)tStr[0]++;else tStr[0]=0; if(tStr[0]===3){log(h,"TURKEY",5,0);tStr[0]=0;}
                    if(t2H)tStr[1]++;else tStr[1]=0; if(tStr[1]===3){log(h,"TURKEY",5,2);tStr[1]=0;}
                    let same=gS.every(v=>v===gS[0]),bP=gS.every(v=>v>=par+1),dP=gS.every(v=>v>=par+2),hJP=0;
                    if(same)hJP+=2; if(dP)hJP+=10; else if(bP)hJP+=5; jpP+=hJP;
                    let t1N=Math.min(nS[0],nS[1]),t2N=Math.min(nS[2],nS[3]);
                    if(t1N<t2N&&jpP>0){log(h,"WIN POT",jpP,0);jpP=0;} else if(t2N<t1N&&jpP>0){log(h,"WIN POT",jpP,2);jpP=0;}
                    else if(jpP>0&&h<18){ let bT=dP?"PF":(bP?"JF":"JP"); document.getElementById(`badge-${h+1}`).innerHTML=`<div class="jp-badge">${bT} $${jpP}</div>`; }
                }
            }
            document.getElementById('log-content').innerHTML=logH||'No trash yet.';
            let totalMD=0; const mList=document.getElementById('match-list'); mList.innerHTML='';
            activeBets.forEach(m => {
                let d=0; for(let h=m.start;h<=m.end;h++){ let r=true,ns=[]; for(let i=0;i<4;i++){ let d=holeData[h]?.[i]; if(!d||d.gross===''){r=false;break;} ns[i]=parseInt(d.gross)-(roster.players[i].ch>=course.hcp[h-1]?1:0); } if(r){ let aB=Math.min(ns[0],ns[1]),bB=Math.min(ns[2],ns[3]); if(aB<bB)d++; else if(bB<aB)d--; } }
                totalMD+=(d*roster.nassauVal);
                let sT=d===0?"AS":(d>0?`${roster.t1} +${d}`:`${roster.t2} +${Math.abs(d)}`);
                mList.innerHTML+=`<div class="flex justify-between items-center"><span>${m.name}</span><span class="font-mono text-emerald-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">${sT}</span></div>`;
            });
            document.getElementById('t1-final').innerText=`${roster.t1}: $${t1_t+totalMD}`;
            document.getElementById('t2-final').innerText=`${roster.t2}: $${t2_t-totalMD}`;
        }

        function openPressMenu() {
            let sug=activeHole+1>18?18:activeHole+1;
            let startH=parseInt(prompt("Hole for press:", sug)); if(isNaN(startH)||startH<1||startH>18)return;
            let type=prompt(`PRESS H${startH}:\n1: Single Match (F9/B9)\n2: Double Stake (Side + Total)\n3: Cancel`);
            if(type==='1') activeBets.push({id:Date.now(), name:`P-Match H${startH} (${startH<=9?'F9':'B9'})`, start:startH, end:startH<=9?9:18});
            if(type==='2') { activeBets.push({id:Date.now()+'a', name:`P-Match H${startH} (F9)`, start:startH, end:9}); activeBets.push({id:Date.now()+'b', name:`P-Total H${startH} (T18)`, start:startH, end:18}); }
            localStorage.setItem('golf_bets',JSON.stringify(activeBets)); pushToCloud(); buildTable();
        }

        window.onload=init;
    </script>
</body>
