<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GAME: Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .golf-card { background: #1e293b; border-bottom: 2px solid #334155; }
        .dot { height: 6px; width: 6px; background: #fbbf24; border-radius: 50%; display: inline-block; margin: 1px; }
        .active-player { border: 2px solid #10b981; background: #064e3b !important; }
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 pb-20">

    <div id="app" class="max-w-md mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-black text-emerald-500">THE GAME</h1>
            <button onclick="toggleSetup()" class="bg-slate-700 px-3 py-1 rounded text-xs uppercase">Round Setup</button>
        </header>

        <section id="setup-panel" class="hidden bg-slate-800 p-4 rounded-xl mb-6 shadow-2xl">
            <h2 class="text-sm font-bold text-slate-400 mb-4 uppercase">Select 4 Players & Verify Index</h2>
            <div id="player-list" class="grid grid-cols-2 gap-2 mb-4">
                </div>
            <button onclick="startRound()" class="w-full bg-emerald-600 py-3 rounded-lg font-bold">Lock In Round</button>
        </section>

        <main id="round-panel">
            <div id="hole-grid" class="grid grid-cols-6 gap-2 mb-8">
                </div>

            <div class="bg-slate-800 p-4 rounded-xl">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">Live Stakes</h3>
                <div id="live-ledger" class="space-y-1 font-mono text-sm">
                    </div>
            </div>
        </main>
    </div>

    <script>
        const players = [
            { name: "The Wolf", index: 10.4 }, { name: "The Shark", index: 8.2 },
            { name: "The Raccoon", index: 15.1 }, { name: "The Pig", index: 12.5 },
            { name: "The Hyena", index: 11.0 }, { name: "The Woodpecker", index: 14.2 }
        ];

        let selectedPlayers = [];
        let scores = {}; // Stores { hole: { player: score } }

        function init() {
            const list = document.getElementById('player-list');
            players.forEach(p => {
                list.innerHTML += `
                    <div id="btn-${p.name.replace(' ', '')}" onclick="togglePlayer('${p.name}')" class="bg-slate-700 p-3 rounded-lg cursor-pointer text-center">
                        <div class="text-xs font-bold">${p.name}</div>
                        <div class="text-[10px] text-slate-400">Idx: ${p.index}</div>
                    </div>`;
            });
            renderHoles();
        }

        function togglePlayer(name) {
            const idx = selectedPlayers.indexOf(name);
            if (idx > -1) selectedPlayers.splice(idx, 1);
            else if (selectedPlayers.length < 4) selectedPlayers.push(name);
            
            // UI Toggle
            document.querySelectorAll('#player-list div').forEach(el => el.classList.remove('active-player'));
            selectedPlayers.forEach(p => document.getElementById(`btn-${p.replace(' ', '')}`).classList.add('active-player'));
        }

        function renderHoles() {
            const grid = document.getElementById('hole-grid');
            for(let i=1; i<=18; i++) {
                grid.innerHTML += `<button onclick="scoreHole(${i})" class="bg-slate-800 h-16 rounded border border-slate-700 font-bold">${i}</button>`;
            }
        }

        function scoreHole(n) {
            if (selectedPlayers.length < 4) return alert("Select 4 players in Setup first!");
            
            // Logic for Moose Knuckle on Par 3s
            // (Assuming Par 3s are 3, 6, 12, 16 for this demo)
            const par3s = [3, 6, 12, 16];
            if (par3s.includes(n)) {
                if(confirm("Hole " + n + ": Moose Knuckle Called?")) {
                    const mk = prompt("1:Birdie(+5), 2:Par(+2), 3:Bogey(+1 to Opp)");
                    // Logic to award money...
                }
            }

            // Individual Score Entry
            selectedPlayers.forEach(p => {
                const s = prompt(`Enter Gross Score for ${p} on Hole ${n}:`);
                if (!scores[n]) scores[n] = {};
                scores[n][p] = parseInt(s);
            });
        }

        function toggleSetup() { document.getElementById('setup-panel').classList.toggle('hidden'); }

        init();
    </script>
</body>
</html>
