<script>
    const SB_URL = 'https://juplwsfiqlwegiznhxgm.supabase.co';
    const SB_KEY = 'sb_publishable_gg2_oR09BOYwnYHDgdRXug_LiRwKNyp';
    
    // Logan River Data
    const course = {
        name: "Logan River", rating: 70.1, slope: 121, par: 71,
        pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
        hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
    };

    let activePlayers = [
        { name: "", idx: 0 }, { name: "", idx: 0 },
        { name: "", idx: 0 }, { name: "", idx: 0 }
    ];

    function init() {
        const pDiv = document.getElementById('p-select');
        pDiv.innerHTML = '<div class="col-span-2 text-[10px] text-slate-500 mb-2 uppercase">Enter Player Names & Indexes</div>';
        
        for(let i=0; i<4; i++) {
            pDiv.innerHTML += `
                <div class="flex gap-2 mb-2">
                    <input type="text" id="p${i}-name" placeholder="Name" class="bg-slate-700 p-2 rounded w-2/3 text-sm">
                    <input type="number" id="p${i}-idx" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm">
                </div>`;
        }

        const gDiv = document.getElementById('grid');
        gDiv.innerHTML = ''; // Clear for rebuild
        for(let i=1; i<=18; i++) {
            const isP3 = course.pars[i-1] === 3;
            gDiv.innerHTML += `
                <button id="hole-${i}" onclick="scoreHole(${i}, ${isP3})" class="bg-slate-800 h-14 rounded-lg border border-slate-700 flex flex-col items-center justify-center">
                    <span class="text-[10px] text-slate-500">${i}</span>
                    ${isP3 ? '<div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>' : ''}
                </button>`;
        }
    }

    function savePlayers() {
        for(let i=0; i<4; i++) {
            activePlayers[i].name = document.getElementById(`p${i}-name`).value || `Player ${i+1}`;
            activePlayers[i].idx = parseFloat(document.getElementById(`p${i}-idx`).value) || 0;
        }
        document.getElementById('setup').classList.add('hidden');
        alert("Roster Locked for " + course.name);
    }

    function scoreHole(n, isP3) {
        if(!activePlayers[0].name) return alert("Tap 'Setup' and enter names first!");
        
        // Moose Knuckle Logic
        if(isP3 && confirm("Hole " + n + ": Moose Knuckle?")) {
            let mk = prompt(`MK Result:\n1: Birdie (+$5 to ${activePlayers[0].name}/${activePlayers[1].name})\n2: Par (+$2 to ${activePlayers[0].name}/${activePlayers[1].name})\n3: Bogey (+$1 to Opponents)`);
        }
        
        // Individual Gross Score Entry
        activePlayers.forEach(p => {
            prompt(`Gross Score for ${p.name} on Hole ${n}:`);
        });

        document.getElementById(`hole-${n}`).classList.add('bg-emerald-900', 'border-emerald-500');
    }

    window.onload = init;
</script>
