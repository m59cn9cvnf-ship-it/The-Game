<script>
    const course = {
        name: "Logan River", rating: 70.1, slope: 121, par: 71,
        pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
        hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
    };

    let roster = [];
    let totals = { a: 0, b: 0, nassau: 0 }; 
    let holeResults = {}; // Stores { hole: { p0: gross, p0_net: net ... } }

    function init() {
        const gDiv = document.getElementById('grid');
        for(let i=1; i<=18; i++) {
            const isP3 = course.pars[i-1] === 3;
            gDiv.innerHTML += `
                <button id="hole-${i}" onclick="scoreHole(${i}, ${isP3})" class="bg-slate-800 h-16 rounded-lg border border-slate-700 flex flex-col items-center justify-center relative">
                    <span class="text-[10px] text-slate-500">${i}</span>
                    <div id="dots-${i}" class="flex gap-0.5 mt-1"></div>
                    ${isP3 ? '<div class="absolute top-1 right-1 w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>' : ''}
                </button>`;
        }
    }

    function saveRoster() {
        roster = [];
        for(let i=0; i<4; i++) {
            let name = document.getElementById(`p${i}-n`).value || `P${i+1}`;
            let idx = parseFloat(document.getElementById(`p${i}-i`).value) || 0;
            // Calculate Course Handicap
            let courseHcp = Math.round((idx * (course.slope / 113)) + (course.rating - course.par));
            roster.push({ name, idx, courseHcp });
        }
        
        applyDots();
        document.getElementById('setup').classList.add('hidden');
        updateDisplay();
    }

    function applyDots() {
        // Clear old dots
        for(let h=1; h<=18; h++) document.getElementById(`dots-${h}`).innerHTML = '';
        
        roster.forEach((p, pIdx) => {
            for(let h=1; h<=18; h++) {
                let hcpRank = course.hcp[h-1];
                let strokes = 0;
                if (p.courseHcp >= hcpRank) strokes = 1;
                if (p.courseHcp >= hcpRank + 18) strokes = 2; // Double dots
                
                if(strokes > 0) {
                    const dotHtml = `<div class="w-1 h-1 rounded-full bg-amber-500"></div>`.repeat(strokes);
                    document.getElementById(`dots-${h}`).innerHTML += dotHtml;
                }
            }
        });
    }

    function scoreHole(n, isP3) {
        if(roster.length < 4) return alert("Setup players first!");
        
        let holeData = { gross: [], net: [] };
        
        // 1. Moose Knuckle
        if(isP3 && confirm("Moose Knuckle?")) {
            let res = prompt("1:Birdie(+$5 T1), 2:Par(+$2 T1), 3:Bogey(+$1 T2)");
            if(res === '1') totals.a += 5;
            if(res === '2') totals.a += 2;
            if(res === '3') totals.b += 1;
        }
        
        // 2. Gross & Net Entry
        roster.forEach((p, i) => {
            let gross = parseInt(prompt(`${p.name} (Hcp ${p.courseHcp}) Score:`)) || 0;
            let strokes = 0;
            if (p.courseHcp >= course.hcp[n-1]) strokes = 1;
            if (p.courseHcp >= course.hcp[n-1] + 18) strokes = 2;
            
            let net = gross - strokes;
            holeData.gross[i] = gross;
            holeData.net[i] = net;

            // Trash Detection
            if(gross === course.pars[n-1] - 1) i < 2 ? totals.a += 1 : totals.b += 1;
            if(gross === 1) i < 2 ? totals.a += 100 : totals.b += 100;
        });

        // 3. Nassau Logic (Low Net Team Score)
        let teamANet = Math.min(holeData.net[0], holeData.net[1]);
        let teamBNet = Math.min(holeData.net[2], holeData.net[3]);
        
        if(teamANet < teamBNet) totals.nassau += 1; // Team A wins hole
        else if(teamBNet < teamANet) totals.nassau -= 1; // Team B wins hole

        holeResults[n] = holeData;
        document.getElementById(`hole-${n}`).classList.add('score-entered');
        updateDisplay();
    }

    function updateDisplay() {
        let nassauText = totals.nassau > 0 ? `Team 1 +${totals.nassau}` : (totals.nassau < 0 ? `Team 2 +${Math.abs(totals.nassau)}` : "All Square");
        document.getElementById('ledger-a').innerHTML = `<span class="text-slate-400 text-xs">Total</span><br>${roster[0].name}/${roster[1].name}: $${totals.a}`;
        document.getElementById('ledger-b').innerHTML = `<span class="text-slate-400 text-xs">Total</span><br>${roster[2].name}/${roster[3].name}: $${totals.b}`;
        document.getElementById('display-names').innerHTML = `<span class="text-emerald-400 font-bold">Nassau: ${nassauText}</span>`;
    }
</script>
