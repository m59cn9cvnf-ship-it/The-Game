<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border-bottom: 3px solid #334155; }
        .btn-player { background: #334155; transition: all 0.2s; }
        .active-p { background: #059669 !important; border: 2px solid #10b981; }
    </style>
</head>
<body class="p-4">

    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter text-emerald-400">THE GAME</h1>
            <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-xs bg-slate-800 px-3 py-2 rounded-full border border-slate-700 uppercase font-bold">Setup</button>
        </header>

        <section id="setup" class="hidden card mb-6">
            <h2 class="text-xs font-bold text-slate-500 uppercase mb-4">Select 4 Players</h2>
            <div id="p-select" class="grid grid-cols-2 gap-2 mb-4"></div>
            <button onclick="document.getElementById('setup').classList.add('hidden')" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">Save Selection</button>
        </section>

        <main id="game-ui">
            <div id="grid" class="grid grid-cols-6 gap-2 mb-6"></div>
            
            <div class="card">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase mb-2">Stakes Tracker</h3>
                <div id="ledger" class="space-y-1 text-sm font-mono text-emerald-400">
                    <div>TEAM A: $0</div>
                    <div>TEAM B: $0</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // CONFIG
        const SB_URL = 'https://juplwsfiqlwegiznhxgm.supabase.co';
        const SB_KEY = 'sb_publishable_gg2_oR09BOYwnYHDgdRXug_LiRwKNyp';
        const players = ["The Wolf", "The Shark", "The Raccoon", "The Pig", "The Hyena", "The Woodpecker"];
        let selected = [];

        // INITIALIZE
        function init() {
            // Render Players
            const pDiv = document.getElementById('p-select');
            players.forEach(p => {
                pDiv.innerHTML += `<button id="btn-${p.replace(' ','')}" onclick="toggleP('${p}')" class="btn-player p-3 rounded-lg text-sm font-bold">${p}</button>`;
            });

            // Render 18 Holes
            const gDiv = document.getElementById('grid');
            for(let i=1; i<=18; i++) {
                const isPar3 = [3, 6, 12, 16].includes(i); // Hardcoded Par 3s for now
                gDiv.innerHTML += `
                    <button onclick="scoreHole(${i}, ${isPar3})" class="bg-slate-800 h-14 rounded-lg border border-slate-700 flex flex-col items-center justify-center">
                        <span class="text-[10px] text-slate-500">${i}</span>
                        ${isPar3 ? '<div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>' : ''}
                    </button>`;
            }
        }

        function toggleP(name) {
            const i = selected.indexOf(name);
            if(i > -1) selected.splice(i, 1);
            else if(selected.length < 4) selected.push(name);
            
            document.querySelectorAll('.btn-player').forEach(b => b.classList.remove('active-p'));
            selected.forEach(s => document.getElementById('btn-' + s.replace(' ','')).classList.add('active-p'));
        }

        function scoreHole(n, isP3) {
            if(selected.length < 4) return alert("Tap 'Setup' and select 4 players first!");
            
            if(isP3 && confirm("Hole " + n + ": Moose Knuckle Called?")) {
                let res = prompt("1:Birdie(+$5), 2:Par(+$2), 3:Bogey(+$1 to Opp)");
                alert("MK Recorded.");
            }
            
            selected.forEach(p => {
                prompt("Gross Score for " + p + " on Hole " + n);
            });
        }

        // Run on load
        window.onload = init;
    </script>
</body>
</html>
