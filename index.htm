<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME: v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; font-family: sans-serif; overflow-x: hidden; }
        .card { background: #1e293b; border-radius: 12px; padding: 12px; border-bottom: 3px solid #334155; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #334155; padding: 14px 10px; text-align: center; min-width: 60px; position: relative; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; z-index: 10; min-width: 110px; text-align: left; border-right: 2px solid #475569; }
        .score-cell { height: 55px; background: #0f172a; font-weight: bold; font-size: 1.2rem; }
        .stat-col { background: #1e293b; font-weight: 800; color: #10b981; min-width: 50px; }
        .stroke-dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; }
        .jp-badge { font-size: 7px; font-weight: 900; padding: 1px 3px; border-radius: 3px; background: #ef4444; color: white; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 5; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-2">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <h1 class="text-xl font-black italic text-emerald-400 uppercase tracking-tighter">The Game</h1>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="text-[9px] bg-red-900/30 text-red-400 px-2 py-1 rounded border border-red-900/50 uppercase font-bold">Reset</button>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-[10px] bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 uppercase font-bold text-emerald-400">Setup</button>
            </div>
        </header>

        <section id="setup" class="card mb-4 hidden">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="space-y-1">
                    <input type="text" id="t1-name-in" placeholder="T1 Name" class="bg-slate-900 p-2 rounded w-full text-xs border border-slate-700">
                    <div id="t1-players"></div>
                </div>
                <div class="space-y-1">
                    <input type="text" id="t2-name-in" placeholder="T2 Name" class="bg-slate-900 p-2 rounded w-full text-xs border border-slate-700">
                    <div id="t2-players"></div>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase">Nassau Payout ($ per point)</label>
                <input type="number" id="nassau-val-in" placeholder="e.g. 5" class="bg-slate-900 p-2 rounded w-full text-xs border border-slate-700 mt-1">
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2">
                <input type="text" id="course-name" placeholder="Course" class="bg-slate-900 p-2 rounded text-xs border border-slate-700 col-span-3">
                <input type="number" id="course-rating" placeholder="Rate" class="bg-slate-900 p-2 rounded text-xs border border-slate-700">
                <input type="number" id="course-slope" placeholder="Slope" class="bg-slate-900 p-2 rounded text-xs border border-slate-700">
                <input type="number" id="course-par" placeholder="Par" class="bg-slate-900 p-2 rounded text-xs border border-slate-700">
            </div>
            <div class="space-y-2 mb-4">
                <input type="text" id="course-pars-list" placeholder="Pars (4,4,3...)" class="bg-slate-900 p-2 rounded w-full text-xs border border-slate-700">
                <input type="text" id="course-hcp-list" placeholder="HCPs (1,13,11...)" class="bg-slate-900 p-2 rounded w-full text-xs border border-slate-700">
            </div>
            <button onclick="saveEverything()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-xs">Lock Game</button>
        </section>

        <div class="table-container mb-4 shadow-2xl">
            <table>
                <thead>
                    <tr id="header-row" class="bg-slate-800 text-slate-400 text-[11px]">
                        <th class="sticky-col">HOLE</th>
                    </tr>
                    <tr id="par-row" class="bg-slate-900 text-slate-500 text-[10px]">
                        <th class="sticky-col text-[8px]">PAR/HCP</th>
                    </tr>
                </thead>
                <tbody id="player-rows"></tbody>
            </table>
        </div>

        <div class="card bg-slate-900 border-emerald-500/30 sticky bottom-2 shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Live Ledger</div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('log-modal').style.display='flex'" class="bg-slate-800 px-3 py-1 rounded text-[9px] font-bold uppercase border border-slate-700">Trash Log</button>
                    <button id="press-btn" onclick="openPressMenu()" class="hidden bg-red-600 px-3 py-1 rounded text-[9px] font-black uppercase">Add Press</button>
                </div>
            </div>
            <div id="match-list" class="space-y-1 mb-3"></div>
            <div class="grid grid-cols-2 gap-2 text-[10px] font-mono border-t border-slate-800 pt-2 mb-1">
                <div id="t1-trash" class="text-slate-400">T1 Trash: $0</div>
                <div id="t2-trash" class="text-slate-400 text-right">T2 Trash: $0</div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[12px] font-black border-t border-slate-800 pt-1 uppercase">
                <div id="t1-total" class="text-emerald-400">T1 Total: $0</div>
                <div id="t2-total" class="text-amber-400 text-right">T2 Total: $0</div>
            </div>
        </div>
    </div>

    <div id="score-modal" class="modal">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-xs border border-slate-700 shadow-2xl">
            <div id="modal-title" class="text-center mb-2 font-bold text-emerald-400 text-lg uppercase">Hole Entry</div>
            <div id="mk-container" class="hidden mb-4"><button id="mk-btn" onclick="triggerMK()" class="w-full py-2 rounded-lg border border-slate-600 bg-slate-700 text-[9px] font-black uppercase text-slate-300">Moose Knuckle</button></div>
            <div class="space-y-4" id="modal-inputs"></div>
            <button onclick="closeModal()" class="w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold uppercase">Save Hole</button>
        </div>
    </div>

    <div id="log-modal" class="modal">
        <div class="bg-slate-900 p-6 rounded-2xl w-full max-w-sm border border-slate-700 max-h-[80vh] flex flex-col">
            <h2 class="text-center font-black text-emerald-500 uppercase mb-4 tracking-tighter">Trash History</h2>
            <div id="log-content" class="overflow-y-auto flex-grow mb-4 pr-2 text-xs"></div>
            <button onclick="document.getElementById('log-modal').style.display='none'" class="w-full bg-slate-700 py-3 rounded-xl font-bold uppercase text-xs">Close</button>
        </div>
    </div>

    <script>
        let course = JSON.parse(localStorage.getItem('golf_course')) || {
            name: "Logan River", rating: 70.1, slope: 121, par: 71,
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1,13,11,7,3,15,17,5,9,2,12,16,10,4,18,14,6,8]
        };
        let roster = JSON.parse(localStorage.getItem('golf_roster')) || { t1: "Team 1", t2: "Team 2", players: [], nassauVal: 0 };
        let scores = JSON.parse(localStorage.getItem('golf_scores')) || {};
        let presses = JSON.parse(localStorage.getItem('golf_presses')) || {}; 
        let mk_results = JSON.parse(localStorage.getItem('golf_mk')) || {}; 
        let activeHole = 1;

        function init() {
            document.getElementById('t1-name-in').value = roster.t1 || "";
            document.getElementById('t2-name-in').value = roster.t2 || "";
            document.getElementById('nassau-val-in').value = roster.nassauVal || "";
            document.getElementById('course-name').value = course.name;
            document.getElementById('course-rating').value = course.rating;
            document.getElementById('course-slope').value = course.slope;
            document.getElementById('course-par').value = course.par;
            document.getElementById('course-pars-list').value = course.pars.join(',');
            document.getElementById('course-hcp-list').value = course.hcp.join(',');

            const t1Div = document.getElementById('t1-players');
            const t2Div = document.getElementById('t2-players');
            t1Div.innerHTML = ''; t2Div.innerHTML = '';
            for(let i=0; i<4; i++) {
                const target = i < 2 ? t1Div : t2Div;
                target.innerHTML += `
                <input type="text" id="p-n-${i}" value="${roster.players?.[i]?.name || ''}" placeholder="Name" class="bg-slate-800 p-2 rounded w-full text-white text-[10px] border border-slate-700 mb-1">
                <input type="number" id="p-i-${i}" value="${roster.players?.[i]?.idx ?? ''}" placeholder="Idx" class="bg-slate-800 p-2 rounded w-full text-white text-[10px] border border-slate-700 mb-2">`;
            }
            if(roster.players?.length > 0) buildTable();
            else document.getElementById('setup').classList.remove('hidden');
        }

        function saveEverything() {
            course = {
                name: document.getElementById('course-name').value,
                rating: parseFloat(document.getElementById('course-rating').value),
                slope: parseInt(document.getElementById('course-slope').value),
                par: parseInt(document.getElementById('course-par').value),
                pars: document.getElementById('course-pars-list').value.split(',').map(Number),
                hcp: document.getElementById('course-hcp-list').value.split(',').map(Number)
            };
            localStorage.setItem('golf_course', JSON.stringify(course));

            roster = { 
                t1: document.getElementById('t1-name-in').value || "Team 1", 
                t2: document.getElementById('t2-name-in').value || "Team 2", 
                nassauVal: parseFloat(document.getElementById('nassau-val-in').value) || 0,
                players: [] 
            };
            for(let i=0; i<4; i++) {
                let n = document.getElementById(`p-n-${i}`).value || `P${i+1}`;
                let idxInput = document.getElementById(`p-i-${i}`).value;
                let idx = idxInput !== "" ? parseFloat(idxInput) : 0;
                let ch = Math.round((idx * (course.slope / 113)) + (course.rating - course.par));
                roster.players.push({ name: n, idx: idx, ch: ch });
            }
            localStorage.setItem('golf_roster', JSON.stringify(roster));
            document.getElementById('setup').classList.add('hidden');
            location.reload();
        }

        function buildTable() {
            const hRow = document.getElementById('header-row');
            const pRow = document.getElementById('par-row');
            hRow.innerHTML = '<th class="sticky-col">HOLE</th>';
            pRow.innerHTML = '<th class="sticky-col text-[8px]">PAR/HCP</th>';
            for(let i=1; i<=18; i++) {
                hRow.innerHTML += `<th id="h-head-${i}">${i}<div id="badge-${i}"></div></th>`;
                pRow.innerHTML += `<td id="p-head-${i}">${course.pars[i-1]}<br><span class="opacity-30">${course.hcp[i-1]}</span></td>`;
            }
            hRow.innerHTML += `<th class="stat-col">TOT</th><th class="stat-col">+/-</th>`;
            pRow.innerHTML += `<td class="stat-col text-[8px]">${course.par}</td><td class="stat-col text-[8px]">E</td>`;

            const tbody = document.getElementById('player-rows');
            tbody.innerHTML = '';
            roster.players.forEach((p, pIdx) => {
                let totalGross = 0;
                let row = `<tr><td class="sticky-col"><div class="text-[8px] font-bold text-slate-500 uppercase">${pIdx < 2 ? roster.t1 : roster.t2}</div><div class="text-xs font-bold">${p.name}</div></td>`;
                for(let h=1; h<=18; h++) {
                    const s = scores[`${pIdx}_${h}`] || '';
                    if(s !== '') totalGross += parseInt(s);
                    const pCls = presses[h] ? (presses[h] === 'double' ? 'border-l-[8px] border-double border-emerald-500' : 'border-l-[4px] border-emerald-500') : '';
                    row += `<td class="score-cell ${pCls} ${s!==''?'bg-emerald-900/10':''}" onclick="openModal(${h})">
                                <span>${s}</span>
                                ${p.ch >= course.hcp[h-1] ? '<div class="stroke-dot"></div>' : ''}
                            </td>`;
                }
                const rel = totalGross > 0 ? (totalGross - course.par) : 0;
                const relText = rel === 0 ? "E" : (rel > 0 ? `+${rel}` : rel);
                row += `<td class="stat-col text-sm">${totalGross}</td><td class="stat-col text-sm">${relText}</td>`;
                tbody.innerHTML += row + '</tr>';
            });
            calculateEverything();
        }

        function openModal(h) {
            activeHole = h;
            document.getElementById('modal-title').innerText = `HOLE ${h}`;
            document.getElementById('mk-container').classList.toggle('hidden', course.pars[h-1] !== 3);
            const inputArea = document.getElementById('modal-inputs');
            inputArea.innerHTML = '';
            roster.players.forEach((p, i) => {
                inputArea.innerHTML += `
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] text-slate-400 uppercase font-bold">${p.name}</label>
                        <input type="number" id="mod-in-${i}" inputmode="numeric" value="${scores[`${i}_${h}`] || ''}" class="bg-slate-900 border border-slate-600 p-3 rounded-lg w-20 text-center font-bold text-xl" oninput="if(this.value.length >= 1 && ${i < 3}) document.getElementById('mod-in-${i+1}').focus()">
                    </div>`;
            });
            document.getElementById('score-modal').style.display = 'flex';
            document.getElementById('mod-in-0').focus();
        }

        function triggerMK() {
            let res = prompt("MK Outcome?\n1: Birdie (+$5)\n2: Par (+$2)\n3: Bogey (+$1 to Opp)");
            if(['1','2','3'].includes(res)) mk_results[activeHole] = res;
            localStorage.setItem('golf_mk', JSON.stringify(mk_results));
            closeModal();
        }

        function closeModal() {
            for(let i=0; i<4; i++) {
                let v = document.getElementById(`mod-in-${i}`).value;
                scores[`${i}_${activeHole}`] = v ? parseInt(v) : '';
            }
            localStorage.setItem('golf_scores', JSON.stringify(scores));
            document.getElementById('score-modal').style.display = 'none';
            buildTable();
        }

        function calculateEverything() {
            let t1_trash = 0, t2_trash = 0, logHtml = '', jackpotPool = 0;
            let teamStreaks = [0, 0];
            for(let i=1; i<=18; i++) { if(document.getElementById(`badge-${i}`)) document.getElementById(`badge-${i}`).innerHTML = ''; }

            function log(hole, label, amt, tIdx) {
                logHtml = `<div class="log-row"><span>H${hole} - ${label}</span><span class="${tIdx < 2 ? 'text-emerald-400':'text-amber-400'}">+$${amt}</span></div>` + logHtml;
                tIdx < 2 ? t1_trash += amt : t2_trash += amt;
            }

            for(let h=1; h<=18; h++) {
                let ready = true, gS = [], nS = [];
                let par = course.pars[h-1];
                for(let i=0; i<4; i++) {
                    let g = scores[`${i}_${h}`];
                    if(g === '' || g === undefined) { ready = false; break; }
                    gS[i] = g;
                    nS[i] = g - (roster.players[i].ch >= course.hcp[h-1] ? 1 : 0);
                }

                if(mk_results[h]) {
                    if(mk_results[h] === '1') log(h, "Moose Birdie", 5, 0);
                    if(mk_results[h] === '2') log(h, "Moose Par", 2, 0);
                    if(mk_results[h] === '3') log(h, "Moose Challenger", 1, 2);
                }

                if(ready) {
                    let t1B = false, t2B = false, t1BC = 0, t2BC = 0;
                    for(let i=0; i<4; i++) {
                        let g = gS[i];
                        if(g === par - 1 && !mk_results[h]) {
                            log(h, `${roster.players[i].name} Birdie`, 1, i);
                            if(i < 2) { t1B = true; t1BC++; } else { t2B = true; t2BC++; }
                        }
                        if(g <= par - 2 && g > 1) {
                            log(h, `${roster.players[i].name} Eagle`, 10, i);
                            if(i < 2) { t1B = true; t1BC++; } else { t2B = true; t2BC++; }
                        }
                    }
                    if(t1BC === 2 && !mk_results[h]) log(h, `${roster.t1} DOUBLE DOUG`, 8, 0);
                    if(t2BC === 2 && !mk_results[h]) log(h, `${roster.t2} DOUBLE DOUG`, 8, 2);

                    if(t1B) teamStreaks[0]++; else teamStreaks[0] = 0;
                    if(teamStreaks[0] === 3) { log(h, `${roster.t1} TURKEY`, 5, 0); teamStreaks[0] = 0; }
                    if(t2B) teamStreaks[1]++; else teamStreaks[1] = 0;
                    if(teamStreaks[1] === 3) { log(h, `${roster.t2} TURKEY`, 5, 2); teamStreaks[1] = 0; }

                    let same = gS.every(v => v === gS[0]);
                    let bogeyP = gS.every(v => v >= par + 1);
                    let doubleP = gS.every(v => v >= par + 2);
                    let hJP = 0;
                    if(same) hJP += 2;
                    if(doubleP) hJP += 10; else if(bogeyP) hJP += 5;
                    jackpotPool += hJP;

                    let t1N = Math.min(nS[0], nS[1]), t2N = Math.min(nS[2], nS[3]);
                    if(t1N < t2N && jackpotPool > 0) { log(h, `${roster.t1} CLEANED POOL`, jackpotPool, 0); jackpotPool = 0; }
                    else if(t2N < t1N && jackpotPool > 0) { log(h, `${roster.t2} CLEANED POOL`, jackpotPool, 2); jackpotPool = 0; }
                    else if(jackpotPool > 0 && h < 18) {
                        let bT = doubleP ? "PF" : (bogeyP ? "JF" : "JP");
                        document.getElementById(`badge-${h+1}`).innerHTML = `<div class="jp-badge">${bT} $${jackpotPool}</div>`;
                    }
                }
            }
            document.getElementById('log-content').innerHTML = logHtml || 'No trash yet.';
            
            let matchHistory = [{ start: 1, name: 'Original' }];
            Object.keys(presses).forEach(h => matchHistory.push({ start: parseInt(h), name: `Press H${h}` }));
            const mStat = matchHistory.map(m => {
                let d = 0;
                for(let h=m.start; h<=18; h++) {
                    let r = true, ns = [];
                    for(let i=0; i<4; i++) {
                        let gs = scores[`${i}_${h}`];
                        if(gs === '' || gs === undefined) { r = false; break; }
                        ns[i] = gs - (roster.players[i].ch >= course.hcp[h-1] ? 1 : 0);
                    }
                    if(r) {
                        let aB = Math.min(ns[0], ns[1]), bB = Math.min(ns[2], ns[3]);
                        if(aB < bB) d++; else if(bB < aB) d--;
                    }
                }
                return { name: m.name, diff: d };
            });
            
            const mList = document.getElementById('match-list'); mList.innerHTML = '';
            let anyoneDown = false;
            let totalMatchDollars = 0;
            mStat.forEach(m => {
                if(m.diff !== 0) anyoneDown = true;
                totalMatchDollars += (m.diff * roster.nassauVal);
                let s = m.diff === 0 ? "AS" : (m.diff > 0 ? `${roster.t1} +${m.diff}` : `${roster.t2} +${Math.abs(m.diff)}`);
                document.getElementById('match-list').innerHTML += `<div class="flex justify-between text-xs font-bold"><span>${m.name}</span><span class="text-emerald-400">${s}</span></div>`;
            });
            
            document.getElementById('t1-trash').innerText = `${roster.t1} Trash: $${t1_trash}`;
            document.getElementById('t2-trash').innerText = `${roster.t2} Trash: $${t2_trash}`;
            
            const t1Final = t1_trash + totalMatchDollars;
            const t2Final = t2_trash - totalMatchDollars;
            document.getElementById('t1-total').innerText = `${roster.t1} Total: $${t1Final}`;
            document.getElementById('t2-total').innerText = `${roster.t2} Total: $${t2Final}`;
            
            document.getElementById('press-btn').classList.toggle('hidden', !anyoneDown);
        }

        function openPressMenu() {
            let next = activeHole + 1;
            if(next > 18) return;
            let type = prompt(`PRESS ON HOLE ${next}?\n1: Single Match\n2: Double Stake`);
            if(type === '1') presses[next] = 'single';
            if(type === '2') presses[next] = 'double';
            localStorage.setItem('golf_presses', JSON.stringify(presses));
            buildTable();
        }

        function clearAllData() { if(confirm("Start fresh?")) { localStorage.clear(); location.reload(); } }
        window.onload = init;
    </script>
</body>
</html>
