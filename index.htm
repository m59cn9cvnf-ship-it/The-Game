<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME: Momentum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; font-family: sans-serif; overflow-x: hidden; }
        .card { background: #1e293b; border-radius: 12px; padding: 12px; border-bottom: 3px solid #334155; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: center; min-width: 55px; position: relative; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; z-index: 10; min-width: 110px; text-align: left; border-right: 2px solid #475569; }
        .score-cell { height: 55px; background: #0f172a; font-weight: bold; font-size: 1.2rem; }
        .stroke-dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; }
        
        /* Press Visuals */
        .press-single { border-left: 4px solid #10b981 !important; }
        .press-double { border-left: 8px double #10b981 !important; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-2">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <h1 class="text-xl font-black italic text-emerald-400">THE GAME</h1>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="text-[9px] bg-red-900/30 text-red-400 px-2 py-1 rounded border border-red-900/50 uppercase">Reset</button>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-[10px] bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 uppercase font-bold text-emerald-400">Setup</button>
            </div>
        </header>

        <section id="setup" class="card mb-4">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <input type="text" id="t1-name-in" placeholder="Team 1 Name" class="bg-slate-900 p-2 rounded w-full text-xs mb-2 border border-slate-700">
                    <div class="space-y-1" id="t1-players"></div>
                </div>
                <div>
                    <input type="text" id="t2-name-in" placeholder="Team 2 Name" class="bg-slate-900 p-2 rounded w-full text-xs mb-2 border border-slate-700">
                    <div class="space-y-1" id="t2-players"></div>
                </div>
            </div>
            <button onclick="saveRoster()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-xs">Lock In Game</button>
        </section>

        <div class="table-container mb-4 shadow-2xl">
            <table>
                <thead>
                    <tr id="header-row" class="bg-slate-800 text-slate-400 text-[11px]">
                        <th class="sticky-col">HOLE</th>
                    </tr>
                    <tr id="par-row" class="bg-slate-900 text-slate-500 text-[10px]">
                        <th class="sticky-col">PAR / HCP</th>
                    </tr>
                </thead>
                <tbody id="player-rows"></tbody>
            </table>
        </div>

        <div class="card bg-slate-900 border-emerald-500/30 flex justify-between items-center sticky bottom-2 shadow-2xl">
            <div class="text-xs space-y-1">
                <div id="nassau-val" class="text-emerald-400 font-bold text-lg">AS</div>
                <div id="trash-vals" class="text-slate-400 font-mono text-[10px]">T1: $0 | T2: $0</div>
            </div>
            <button id="press-btn" onclick="openPressMenu()" class="hidden bg-red-600 px-6 py-3 rounded-xl font-black text-xs shadow-lg shadow-red-900/40">PRESS</button>
        </div>
    </div>

    <div id="score-modal" class="modal">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-xs border border-slate-700">
            <div id="modal-title" class="text-center mb-4 font-bold text-emerald-400">Hole Entry</div>
            <div class="space-y-4" id="modal-inputs"></div>
            <button onclick="closeModal()" class="w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">SAVE HOLE</button>
        </div>
    </div>

    <script>
        const course = {
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
        };
        let roster = JSON.parse(localStorage.getItem('golf_roster')) || { t1: "Team 1", t2: "Team 2", players: [] };
        let scores = JSON.parse(localStorage.getItem('golf_scores')) || {};
        let presses = JSON.parse(localStorage.getItem('golf_presses')) || {}; // { hole: 'single'|'double' }
        let totals = { t1_trash: 0, t2_trash: 0, nassau: 0 };
        let activeHole = null;

        function init() {
            const hRow = document.getElementById('header-row');
            const pRow = document.getElementById('par-row');
            const t1Div = document.getElementById('t1-players');
            const t2Div = document.getElementById('t2-players');
            
            for(let i=1; i<=18; i++) {
                hRow.innerHTML += `<th id="h-head-${i}">${i}</th>`;
                pRow.innerHTML += `<td id="p-head-${i}">${course.pars[i-1]}<br><span class="opacity-40">${course.hcp[i-1]}</span></td>`;
            }

            for(let i=0; i<4; i++) {
                const target = i < 2 ? t1Div : t2Div;
                target.innerHTML += `
                <input type="text" id="p-n-${i}" value="${roster.players?.[i]?.name || ''}" placeholder="Player ${i+1}" class="bg-slate-800 p-2 rounded w-full text-white text-[10px] border border-slate-700">
                <input type="number" id="p-i-${i}" value="${roster.players?.[i]?.idx || ''}" placeholder="Idx" class="bg-slate-800 p-2 rounded w-full text-white text-[10px] border border-slate-700 mb-2">`;
            }
            if(roster.players?.length > 0) buildTable();
        }

        function saveRoster() {
            roster = { t1: document.getElementById('t1-name-in').value || "Team 1", t2: document.getElementById('t2-name-in').value || "Team 2", players: [] };
            for(let i=0; i<4; i++) {
                let n = document.getElementById(`p-n-${i}`).value || `P${i+1}`;
                let idx = parseFloat(document.getElementById(`p-i-${i}`).value) || 0;
                let ch = Math.round((idx * (121 / 113)) + (70.1 - 71));
                roster.players.push({ name: n, idx, ch });
            }
            localStorage.setItem('golf_roster', JSON.stringify(roster));
            buildTable();
            document.getElementById('setup').classList.add('hidden');
        }

        function buildTable() {
            const tbody = document.getElementById('player-rows');
            tbody.innerHTML = '';
            roster.players.forEach((p, pIdx) => {
                let row = `<tr><td class="sticky-col"><div class="text-[10px] font-bold text-emerald-500 uppercase">${pIdx < 2 ? roster.t1 : roster.t2}</div><div class="text-xs font-bold">${p.name}</div></td>`;
                for(let h=1; h<=18; h++) {
                    const score = scores[`${pIdx}_${h}`] || '';
                    const pressClass = presses[h] === 'double' ? 'press-double' : (presses[h] === 'single' ? 'press-single' : '');
                    row += `<td class="score-cell ${pressClass}" onclick="openModal(${h})">
                                <span>${score}</span>
                                ${p.ch >= course.hcp[h-1] ? '<div class="stroke-dot"></div>' : ''}
                            </td>`;
                }
                tbody.innerHTML += row + '</tr>';
            });
            
            // Apply borders to headers too
            for(let h=1; h<=18; h++) {
                const cls = presses[h] === 'double' ? 'press-double' : (presses[h] === 'single' ? 'press-single' : '');
                document.getElementById(`h-head-${h}`).className = cls;
                document.getElementById(`p-head-${h}`).className = cls;
            }
            calculateEverything();
        }

        function openModal(h) {
            activeHole = h;
            document.getElementById('modal-title').innerText = `HOLE ${h}`;
            const inputArea = document.getElementById('modal-inputs');
            inputArea.innerHTML = '';
            roster.players.forEach((p, i) => {
                inputArea.innerHTML += `
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] text-slate-400 uppercase">${p.name}</label>
                        <input type="number" id="mod-in-${i}" inputmode="numeric" value="${scores[`${i}_${h}`] || ''}" class="bg-slate-900 border border-slate-600 p-3 rounded-lg w-20 text-center font-bold text-xl" oninput="if(this.value.length >= 1 && ${i < 3}) document.getElementById('mod-in-${i+1}').focus()">
                    </div>`;
            });
            document.getElementById('score-modal').style.display = 'flex';
            document.getElementById('mod-in-0').focus();
        }

        function closeModal() {
            for(let i=0; i<4; i++) {
                let v = document.getElementById(`mod-in-${i}`).value;
                if(v) scores[`${i}_${activeHole}`] = parseInt(v);
            }
            localStorage.setItem('golf_scores', JSON.stringify(scores));
            document.getElementById('score-modal').style.display = 'none';
            buildTable();
        }

        function openPressMenu() {
            let type = prompt("Press Type?\n1: Single (Bold Line)\n2: Double (Double Line)\n3: Delete Press on this hole");
            if(type === '1') presses[activeHole || 1] = 'single';
            else if(type === '2') presses[activeHole || 1] = 'double';
            else if(type === '3') delete presses[activeHole || 1];
            localStorage.setItem('golf_presses', JSON.stringify(presses));
            buildTable();
        }

        function calculateEverything() {
            totals = { t1_trash: 0, t2_trash: 0, nassau: 0 };
            for(let h=1; h<=18; h++) {
                let nets = [];
                let ready = true;
                for(let i=0; i<4; i++) {
                    let g = scores[`${i}_${h}`];
                    if(!g) { ready = false; continue; }
                    nets[i] = g - (roster.players[i].ch >= course.hcp[h-1] ? 1 : 0);
                    if(g === course.pars[h-1] - 1) i < 2 ? totals.t1_trash += 1 : totals.t2_trash += 1;
                }
                if(ready) {
                    let t1Net = Math.min(nets[0], nets[1]);
                    let t2Net = Math.min(nets[2], nets[3]);
                    if(t1Net < t2Net) totals.nassau += 1;
                    if(t2Net < t1Net) totals.nassau -= 1;
                }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('trash-vals').innerText = `${roster.t1}: $${totals.t1_trash} | ${roster.t2}: $${totals.t2_trash}`;
            let n = totals.nassau;
            let team = n > 0 ? roster.t1 : roster.t2;
            document.getElementById('nassau-val').innerText = n === 0 ? "AS" : `${team} +${Math.abs(n)}`;
            document.getElementById('press-btn').classList.toggle('hidden', n === 0);
        }

        function clearAllData() { if(confirm("Start fresh?")) { localStorage.clear(); location.reload(); } }
        window.onload = init;
    </script>
</body>
</html>
