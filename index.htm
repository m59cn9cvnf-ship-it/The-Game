<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; font-family: sans-serif; overflow-x: hidden; }
        .card { background: #1e293b; border-radius: 12px; padding: 12px; border-bottom: 3px solid #334155; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: center; min-width: 55px; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; z-index: 10; min-width: 110px; text-align: left; border-right: 2px solid #475569; }
        .score-cell { position: relative; height: 50px; background: #0f172a; font-weight: bold; font-size: 1.2rem; }
        .stroke-dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-2">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <h1 class="text-xl font-black italic text-emerald-400">THE GAME</h1>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="text-[9px] bg-red-900/30 text-red-400 px-2 py-1 rounded border border-red-900/50 uppercase">Reset</button>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-[10px] bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 uppercase font-bold text-emerald-400">Setup</button>
            </div>
        </header>

        <section id="setup" class="card mb-4">
            <div class="space-y-2 mb-4" id="setup-fields">
                </div>
            <button onclick="saveRoster()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-xs">Save Roster & Close</button>
        </section>

        <div class="table-container mb-4 shadow-2xl">
            <table>
                <thead>
                    <tr id="header-row" class="bg-slate-800 text-slate-400 text-[11px]">
                        <th class="sticky-col">HOLE</th>
                    </tr>
                    <tr id="par-row" class="bg-slate-900 text-slate-500 text-[10px]">
                        <th class="sticky-col">PAR / HCP</th>
                    </tr>
                </thead>
                <tbody id="player-rows"></tbody>
            </table>
        </div>

        <div class="card bg-slate-900 border-emerald-500/30 flex justify-between items-center sticky bottom-2 shadow-2xl">
            <div class="text-xs space-y-1">
                <div id="nassau-val" class="text-emerald-400 font-bold text-lg">Nassau: AS</div>
                <div id="trash-vals" class="text-slate-400 font-mono">T1: $0 | T2: $0</div>
            </div>
            <button id="press-btn" class="hidden bg-red-600 px-4 py-3 rounded-lg font-black text-xs">PRESS</button>
        </div>
    </div>

    <div id="score-modal" class="modal">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-xs border border-slate-700">
            <div id="modal-title" class="text-center mb-4 font-bold text-emerald-400">Hole 1 Entry</div>
            <div id="mk-option" class="mb-4 hidden">
                <button onclick="toggleMK()" id="mk-btn" class="w-full py-2 rounded bg-slate-700 text-[10px] font-bold border border-slate-600 uppercase">Challenge Moose Knuckle</button>
            </div>
            <div class="space-y-4" id="modal-inputs">
                </div>
            <button onclick="closeModal()" class="w-full mt-6 bg-emerald-600 py-3 rounded-xl font-bold">SAVE HOLE</button>
        </div>
    </div>

    <script>
        const course = {
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
        };
        let roster = JSON.parse(localStorage.getItem('golf_roster')) || [];
        let scores = JSON.parse(localStorage.getItem('golf_scores')) || {};
        let totals = { t1: 0, t2: 0, nassau: 0 };
        let activeHole = null;

        function init() {
            const hRow = document.getElementById('header-row');
            const pRow = document.getElementById('par-row');
            const setupDiv = document.getElementById('setup-fields');
            
            for(let i=1; i<=18; i++) {
                hRow.innerHTML += `<th>${i}</th>`;
                pRow.innerHTML += `<td>${course.pars[i-1]}<br><span class="opacity-40">${course.hcp[i-1]}</span></td>`;
            }

            for(let i=0; i<4; i++) {
                setupDiv.innerHTML += `
                <div class="flex gap-2">
                    <input type="text" id="setup-n-${i}" value="${roster[i]?.name || ''}" placeholder="P${i+1} Name" class="bg-slate-700 p-2 rounded w-2/3 text-white text-sm">
                    <input type="number" id="setup-i-${i}" value="${roster[i]?.idx || ''}" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-white text-sm">
                </div>`;
            }

            if(roster.length > 0) buildTable();
        }

        function saveRoster() {
            roster = [];
            for(let i=0; i<4; i++) {
                let n = document.getElementById(`setup-n-${i}`).value;
                let idx = parseFloat(document.getElementById(`setup-i-${i}`).value) || 0;
                let ch = Math.round((idx * (121 / 113)) + (70.1 - 71));
                roster.push({ name: n, idx: idx, ch: ch });
            }
            localStorage.setItem('golf_roster', JSON.stringify(roster));
            buildTable();
            document.getElementById('setup').classList.add('hidden');
        }

        function buildTable() {
            const tbody = document.getElementById('player-rows');
            tbody.innerHTML = '';
            roster.forEach((p, pIdx) => {
                let row = `<tr><td class="sticky-col"><div class="text-xs font-bold">${p.name}</div><div class="text-[9px] text-slate-500">CH: ${p.ch}</div></td>`;
                for(let h=1; h<=18; h++) {
                    const score = scores[`${pIdx}_${h}`] || '';
                    const hasStroke = p.ch >= course.hcp[h-1];
                    row += `<td class="score-cell" onclick="openModal(${h})">
                                <span id="cell-${pIdx}-${h}">${score}</span>
                                ${hasStroke ? '<div class="stroke-dot"></div>' : ''}
                            </td>`;
                }
                tbody.innerHTML += row + '</tr>';
            });
            calculateEverything();
        }

        function openModal(h) {
            activeHole = h;
            document.getElementById('modal-title').innerText = `HOLE ${h} (Par ${course.pars[h-1]})`;
            document.getElementById('mk-option').classList.toggle('hidden', course.pars[h-1] !== 3);
            
            const inputArea = document.getElementById('modal-inputs');
            inputArea.innerHTML = '';
            roster.forEach((p, i) => {
                inputArea.innerHTML += `
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-slate-400 uppercase">${p.name}</label>
                        <input type="number" id="mod-in-${i}" inputmode="numeric" pattern="[0-9]*" 
                               value="${scores[`${i}_${h}`] || ''}" 
                               class="bg-slate-900 border border-slate-600 p-3 rounded-lg w-20 text-center font-bold text-xl"
                               oninput="if(this.value.length >= 1) focusNext(${i})">
                    </div>`;
            });
            document.getElementById('score-modal').style.display = 'flex';
            document.getElementById('mod-in-0').focus();
        }

        function focusNext(i) {
            if(i < 3) document.getElementById(`mod-in-${i+1}`).focus();
        }

        function closeModal() {
            for(let i=0; i<4; i++) {
                let val = document.getElementById(`mod-in-${i}`).value;
                if(val) scores[`${i}_${activeHole}`] = parseInt(val);
            }
            localStorage.setItem('golf_scores', JSON.stringify(scores));
            document.getElementById('score-modal').style.display = 'none';
            buildTable();
        }

        function calculateEverything() {
            totals = { t1: 0, t2: 0, nassau: 0 };
            for(let h=1; h<=18; h++) {
                let nets = [];
                let holeReady = true;
                for(let i=0; i<4; i++) {
                    let g = scores[`${i}_${h}`];
                    if(!g) { holeReady = false; continue; }
                    let net = g - (roster[i].ch >= course.hcp[h-1] ? 1 : 0);
                    nets[i] = net;
                    if(g === course.pars[h-1] - 1) i < 2 ? totals.t1 += 1 : totals.t2 += 1;
                    if(g === 1) i < 2 ? totals.t1 += 100 : totals.t2 += 100;
                }
                if(holeReady) {
                    let t1Net = Math.min(nets[0], nets[1]);
                    let t2Net = Math.min(nets[2], nets[3]);
                    if(t1Net < t2Net) totals.nassau += 1;
                    if(t2Net < t1Net) totals.nassau -= 1;
                }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('trash-vals').innerText = `T1: $${totals.t1} | T2: $${totals.t2}`;
            let n = totals.nassau;
            document.getElementById('nassau-val').innerText = n > 0 ? `Nassau: T1 +${n}` : (n < 0 ? `Nassau: T2 +${Math.abs(n)}` : "Nassau: AS");
            document.getElementById('press-btn').classList.toggle('hidden', n === 0);
        }

        function clearAllData() {
            if(confirm("Wipe everything? This starts a fresh round.")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
