<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border-bottom: 3px solid #334155; }
        input::placeholder { color: #64748b; }
    </style>
</head>
<body class="p-4">

    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter text-emerald-400">THE GAME</h1>
            <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-xs bg-slate-800 px-3 py-2 rounded-full border border-slate-700 uppercase font-bold">Setup Roster</button>
        </header>

        <section id="setup" class="card mb-6">
            <h2 class="text-[10px] font-bold text-slate-500 uppercase mb-4 tracking-widest">Enter Players & Indexes</h2>
            <div id="p-inputs" class="space-y-2 mb-4">
                <div class="flex gap-2"><input type="text" id="p0-n" placeholder="Name 1" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p0-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p1-n" placeholder="Name 2" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p1-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p2-n" placeholder="Name 3" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p2-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p3-n" placeholder="Name 4" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p3-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
            </div>
            <button onclick="saveRoster()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-sm tracking-widest">Lock In Players</button>
        </section>

        <main id="game-ui">
            <div id="grid" class="grid grid-cols-6 gap-2 mb-6"></div>
            <div class="card">
                <div id="ledger" class="text-sm font-mono text-emerald-400">
                    <div class="flex justify-between border-b border-slate-700 mb-2 pb-1"><span class="text-slate-500 uppercase text-[10px]">Current Stakes</span> <span id="course-name">Logan River</span></div>
                    <div id="display-names">Select players to start</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const course = {
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
        };

        let roster = [];

        function init() {
            const gDiv = document.getElementById('grid');
            for(let i=1; i<=18; i++) {
                const isP3 = course.pars[i-1] === 3;
                gDiv.innerHTML += `
                    <button id="hole-${i}" onclick="scoreHole(${i}, ${isP3})" class="bg-slate-800 h-14 rounded-lg border border-slate-700 flex flex-col items-center justify-center">
                        <span class="text-[10px] text-slate-500">${i}</span>
                        ${isP3 ? '<div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>' : ''}
                    </button>`;
            }
        }

        function saveRoster() {
            roster = [];
            for(let i=0; i<4; i++) {
                let name = document.getElementById(`p${i}-n`).value || `Player ${i+1}`;
                let idx = document.getElementById(`p${i}-i`).value || 0;
                roster.push({ name, idx });
            }
            document.getElementById('display-names').innerHTML = `Team 1: ${roster[0].name}/${roster[1].name}<br>Team 2: ${roster[2].name}/${roster[3].name}`;
            document.getElementById('setup').classList.add('hidden');
        }

        function scoreHole(n, isP3) {
            if(roster.length < 4) return alert("Enter names in Setup first!");
            
            if(isP3 && confirm("Moose Knuckle?")) {
                prompt("1:Birdie(+5), 2:Par(+2), 3:Bogey(+1 to Opp)");
            }
            
            roster.forEach(p => prompt(`Hole ${n} score for ${p.name}:`));
            document.getElementById(`hole-${n}`).classList.add('bg-emerald-900', 'border-emerald-500');
        }

        window.onload = init;
    </script>
</body>
</html>
