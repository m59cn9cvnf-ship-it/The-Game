<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GAME v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-golf-dark { background: #0f172a; }
        .accent-border { border-left: 4px solid #10b981; }
        .dot { height: 8px; width: 8px; background-color: #fbbf24; border-radius: 50%; display: inline-block; margin-left: 2px; }
    </style>
</head>
<body class="bg-golf-dark text-slate-100 font-sans min-h-screen p-4">
    <script>
        const supabaseUrl = 'https://juplwsfiqlwegiznhxgm.supabase.co';
        const supabaseKey = 'sb_publishable_gg2_oR09BOYwnYHDgdRXug_LiRwKNyp';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    </script>
    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <h1 class="text-2xl font-black tracking-tighter text-emerald-500">THE GAME</h1>
            <nav class="flex gap-4 text-xs font-bold uppercase tracking-widest text-slate-400">
                <button onclick="showTab('round')">Play</button>
                <button onclick="showTab('stats')">Leaderboard</button>
                <button onclick="showTab('course')">Courses</button>
            </nav>
        </header>

        <div id="tab-round" class="tab-content">
            <div class="bg-slate-800 p-4 rounded-xl shadow-2xl mb-6 accent-border">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">Live Nassau</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-emerald-400 text-sm">TEAM A: <span id="disp-teamA" class="text-xl block font-mono">$0</span></div>
                    <div class="text-emerald-400 text-sm">TEAM B: <span id="disp-teamB" class="text-xl block font-mono">$0</span></div>
                </div>
            </div>
            <div id="scorecard-grid" class="grid grid-cols-6 gap-2"></div>
        </div>

        <div id="tab-stats" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4 text-emerald-500">Year-to-Date Earnings</h2>
            <div id="leaderboard-list" class="space-y-2"></div>
        </div>

        <div id="tab-course" class="tab-content hidden">
            <button onclick="addCourse()" class="w-full bg-emerald-600 py-3 rounded-lg font-bold mb-4">Add New Course</button>
            <div id="course-list" class="space-y-2 text-sm text-slate-400 italic">No courses added yet.</div>
        </div>
    </div>
    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        function calculateCourseHandicap(index, slope, rating, par) {
            return Math.round((index * (slope / 113)) + (rating - par));
        }

        async function init() {
            const grid = document.getElementById('scorecard-grid');
            for(let i=1; i<=18; i++) {
                grid.innerHTML += `<button class="bg-slate-800 p-4 rounded-lg border border-slate-700 font-bold hover:bg-slate-700" onclick="scoreHole(${i})">${i}</button>`;
            }
        }

        function scoreHole(holeNum) {
            const mk = confirm("Was a MOOSE KNUCKLE called on this hole?");
            if (mk) {
                const result = prompt("Who won the MK? (A = Putting Team / B = Challenger / X = Cancel)");
                if(result === 'A') {
                    const outcome = prompt("Did they Birdie or Par? (B/P)");
                    alert(outcome === 'B' ? "Team A wins $5" : "Team A wins $2");
                } else if(result === 'B') {
                    alert("Team B wins $1");
                }
            }
        }
        init();
    </script>
</body>
</html>
