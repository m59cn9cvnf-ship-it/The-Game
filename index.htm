<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAME: Logic v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border-bottom: 3px solid #334155; }
        .score-entered { background-color: #064e3b !important; border-color: #10b981 !important; }
    </style>
</head>
<body class="p-4">

    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter text-emerald-400">THE GAME</h1>
            <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="text-xs bg-slate-800 px-3 py-2 rounded-full border border-slate-700 uppercase font-bold">Setup</button>
        </header>

        <section id="setup" class="card mb-6">
            <h2 class="text-[10px] font-bold text-slate-500 uppercase mb-4 tracking-widest">Team 1 vs Team 2</h2>
            <div class="space-y-2 mb-4">
                <div class="flex gap-2"><input type="text" id="p0-n" placeholder="Player 1" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p0-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p1-n" placeholder="Player 2" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p1-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p2-n" placeholder="Player 3" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p2-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
                <div class="flex gap-2"><input type="text" id="p3-n" placeholder="Player 4" class="bg-slate-700 p-2 rounded w-2/3 text-sm"><input type="number" id="p3-i" placeholder="Idx" class="bg-slate-700 p-2 rounded w-1/3 text-sm"></div>
            </div>
            <button onclick="saveRoster()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-sm">Lock In & Start</button>
        </section>

        <main id="game-ui">
            <div id="grid" class="grid grid-cols-6 gap-2 mb-6"></div>
            
            <div class="card bg-emerald-950/30 border-emerald-500/50">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h3 class="text-[10px] font-bold text-slate-500 uppercase">Live Stakes</h3>
                        <div class="text-xl font-mono" id="ledger-a">Team 1: $0</div>
                        <div class="text-xl font-mono" id="ledger-b">Team 2: $0</div>
                    </div>
                    <button onclick="addPress()" class="bg-red-600 text-[10px] px-3 py-2 rounded font-bold uppercase">Press Nassau</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const course = {
            pars: [4,4,3,4,4,3,4,4,4,4,4,3,4,4,3,4,5,4],
            hcp: [1, 13, 11, 7, 3, 15, 17, 5, 9, 2, 12, 16, 10, 4, 18, 14, 6, 8]
        };

        let roster = [];
        let totals = { a: 0, b: 0 };

        function init() {
            const gDiv = document.getElementById('grid');
            for(let i=1; i<=18; i++) {
                const isP3 = course.pars[i-1] === 3;
                gDiv.innerHTML += `
                    <button id="hole-${i}" onclick="scoreHole(${i}, ${isP3})" class="bg-slate-800 h-14 rounded-lg border border-slate-700 flex flex-col items-center justify-center">
                        <span class="text-[10px] text-slate-500">${i}</span>
                        ${isP3 ? '<div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>' : ''}
                    </button>`;
            }
        }

        function saveRoster() {
            roster = [];
            for(let i=0; i<4; i++) {
                roster.push({
                    name: document.getElementById(`p${i}-n`).value || `P${i+1}`,
                    idx: parseFloat(document.getElementById(`p${i}-i`).value) || 0
                });
            }
            document.getElementById('ledger-a').innerText = `${roster[0].name}/${roster[1].name}: $0`;
            document.getElementById('ledger-b').innerText = `${roster[2].name}/${roster[3].name}: $0`;
            document.getElementById('setup').classList.add('hidden');
        }

        function scoreHole(n, isP3) {
            if(roster.length < 4) return alert("Setup players first!");
            
            // 1. Moose Knuckle
            if(isP3 && confirm("Moose Knuckle?")) {
                let res = prompt("1:Birdie(+$5 T1), 2:Par(+$2 T1), 3:Bogey(+$1 T2)");
                if(res === '1') totals.a += 5;
                if(res === '2') totals.a += 2;
                if(res === '3') totals.b += 1;
            }
            
            // 2. Scores & Trash
            roster.forEach((p, index) => {
                let gross = parseInt(prompt(`${p.name} Score on Hole ${n}:`)) || 0;
                let par = course.pars[n-1];
                
                // Basic Trash Detection (Birdie/Eagle)
                if(gross === par - 1) { 
                    alert(`${p.name} BIRDIE! +$1`);
                    index < 2 ? totals.a += 1 : totals.b += 1;
                }
                if(gross <= par - 2 && gross > 0) { 
                    alert(`${p.name} EAGLE! +$10`);
                    index < 2 ? totals.a += 10 : totals.b += 10;
                }
                if(gross === 1) {
                    alert(`${p.name} HOLE IN ONE! +$100`);
                    index < 2 ? totals.a += 100 : totals.b += 100;
                }
            });

            updateDisplay();
            document.getElementById(`hole-${n}`).classList.add('score-entered');
        }

        function updateDisplay() {
            document.getElementById('ledger-a').innerText = `${roster[0].name}/${roster[1].name}: $${totals.a}`;
            document.getElementById('ledger-b').innerText = `${roster[2].name}/${roster[3].name}: $${totals.b}`;
        }

        function addPress() {
            alert("Nassau Press Active! (Logic recording in next step)");
        }

        window.onload = init;
    </script>
</body>
</html>
